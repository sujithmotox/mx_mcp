# Local stack: sample MySQL + MCP server + Next.js chat.
#   cp .env.example .env   # then set ANTHROPIC_API_KEY
#   docker compose up --build
# Open http://localhost:3000
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: shop
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 3s
      retries: 30

  mcp-server:
    build: ./mcp-server
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: shop
      MYSQL_USER: mcp_reader
      MYSQL_PASSWORD: reader-pass # created by db/init/03-readonly-user.sql
      MCP_API_KEYS: ${MCP_API_KEY:-dev-mcp-key-change-me}
      ALLOWED_TABLES: customers,products,orders,order_items
      QUERY_ROW_LIMIT: 500
      QUERY_TIMEOUT_MS: 5000
      RATE_LIMIT_MAX: 60
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      mcp-server:
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in .env}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      CLAUDE_EFFORT: ${CLAUDE_EFFORT:-medium}
      MCP_MODE: ${MCP_MODE:-local}
      MCP_SERVER_URL: http://mcp-server:8080/mcp
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      MCP_API_KEY: ${MCP_API_KEY:-dev-mcp-key-change-me}
      WEB_BASIC_AUTH: ${WEB_BASIC_AUTH:-}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  mysql-data:
